name: full-sweep (temporary)

on:
  push:
    branches: [ci-check]

permissions:
  contents: read

jobs:
  sweep:
    name: the labs whose checks depend on training, seed ${{ matrix.seed }}, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        seed: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv venv
          uv pip install --torch-backend cpu -e . --group dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the labs in full
        run: |
          mkdir -p out
          { nproc; python -c "import sys, torch, numpy; print(sys.version.split()[0], torch.__version__, numpy.__version__, torch.get_num_threads())"; } | tee out/_machine.txt
          for key in architecture/attention-basics architecture/mixture-of-experts pretraining/scaling-laws pretraining/training-pipeline post-training/sft-data post-training/lora-finetuning post-training/preference-optimization post-training/reasoning-rl evaluation/llm-evaluation inference/quantization inference/kv-cache inference/continuous-batching architecture/efficient-attention inference/speculative-decoding; do
            stem=${key//\//__}
            start=$(date +%s)
            code=0
            timeout 5400 python labs/$key/run.py --seed ${{ matrix.seed }} > out/$stem.txt 2> out/$stem.err || code=$?
            echo "$key seed=${{ matrix.seed }} exit=$code wall=$(( $(date +%s) - start ))s" | tee -a out/_summary.txt
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sweep-py${{ matrix.python-version }}-s${{ matrix.seed }}
          path: out
